<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · KEYTUBE</title><link rel="icon" href="../imagelib/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style/main.css"><link rel="stylesheet" href="../style/pages.css"><link rel="stylesheet" href="../style/profile.css"></head><body class="profile-page"><div id="pbar"></div><div id="pgLoad"><div class="ld"><div class="kb kb-logo"><img src="../imagelib/logo.png" alt="K"></div><div class="ld-t">KEYTUBE</div><div class="spin"></div></div></div><div id="toast"></div><header id="hdr"><button class="hdr-back" onclick="goBack()">‹</button><div class="logo-t">Profile</div><div class="hdr-spacer"></div><div class="hdr-r"><button class="hicon" onclick="window.location.href='studio.html'" title="Studio">🎬</button></div></header><main class="profile-main"><div class="profile-hero"><div class="profile-avatar-wrap"><div class="profile-avatar" id="profileAvatar"><span id="profileInitial">?</span><img id="profileAvatarImg" src="" style="display:none" alt="Avatar"></div><button class="avatar-edit-btn" onclick="document.getElementById('avatarUpload').click()" title="Change photo">📷</button><input type="file" id="avatarUpload" accept="image/*" hidden onchange="uploadAvatar(this)"></div><div class="profile-info"><h2 id="profileName">Loading…</h2><p id="profileEmail" style="color:var(--t2);font-size:.8rem"></p><p id="profileCountry" style="color:var(--t2);font-size:.77rem"></p></div></div><div class="profile-stats-row"><div class="pstat"><div class="pstat-n" id="pUploads">0</div><div class="pstat-l">Videos</div></div><div class="pstat"><div class="pstat-n" id="pFollowers">0</div><div class="pstat-l">Followers</div></div><div class="pstat"><div class="pstat-n" id="pFollowing">0</div><div class="pstat-l">Following</div></div><div class="pstat"><div class="pstat-n" id="pLikes">0</div><div class="pstat-l">Likes</div></div></div><div class="profile-actions"><button class="pr-btn pr-btn-red" onclick="window.location.href='studio.html'">🎬 My Studio</button><button class="pr-btn pr-btn-out" onclick="showTab('settings')">⚙️ Settings</button><button class="pr-btn pr-btn-out" onclick="doLogout()" style="color:var(--red)">🚪 Sign Out</button></div><div class="profile-tabs"><button class="ptab active" id="ptab-uploads" onclick="showTab('uploads')">🎬 Videos</button><button class="ptab" id="ptab-liked" onclick="showTab('liked')">❤️ Liked</button><button class="ptab" id="ptab-playlist" onclick="showTab('playlist')">📋 Saved</button><button class="ptab" id="ptab-settings" onclick="showTab('settings')">⚙️ Settings</button></div><div class="profile-tab-content"><section class="tab-panel active" id="panel-uploads"><div class="gw" id="uploadsGrid"></div><div class="empty-st hidden" id="uploadsEmpty"><div class="ei">🎬</div><p>No videos yet</p><button class="auth-btn" style="margin-top:12px;max-width:200px" onclick="window.location.href='../pages/upload.html'">Upload First Video</button></div></section><section class="tab-panel hidden" id="panel-liked"><div class="gw" id="likedGrid"></div><div class="empty-st hidden" id="likedEmpty"><div class="ei">❤️</div><p>No liked videos yet</p></div></section><section class="tab-panel hidden" id="panel-playlist"><div class="gw" id="playlistGrid"></div><div class="empty-st hidden" id="playlistEmpty"><div class="ei">📋</div><p>Your saved list is empty</p></div></section><section class="tab-panel hidden" id="panel-settings"><div class="settings-card"><h3>Edit Profile</h3><div class="fg"><label for="setName">Display Name</label><input class="fi" id="setName" type="text" placeholder="Your name"></div><div class="fg"><label for="setCountry">Country</label><select class="fi" id="setCountry"><option value="">Select country</option><option>Rwanda</option><option>Nigeria</option><option>Kenya</option><option>Ghana</option><option>South Africa</option><option>France</option><option>USA</option><option>UK</option><option>Canada</option><option>India</option><option>Other</option></select></div><button class="auth-btn" onclick="saveProfile()">Save Changes</button></div><div class="settings-card" style="margin-top:14px"><h3>Change Password</h3><div class="fg"><label for="curPw">Current Password</label><input class="fi" id="curPw" type="password" placeholder="••••••••"></div><div class="fg"><label for="newPw">New Password</label><input class="fi" id="newPw" type="password" placeholder="••••••••"></div><div class="fg"><label for="newPw2">Confirm New Password</label><input class="fi" id="newPw2" type="password" placeholder="••••••••"></div><div class="aerr" id="pwErr"></div><button class="auth-btn" onclick="changePassword()">Update Password</button></div><div class="settings-card danger-zone" style="margin-top:14px"><h3 style="color:var(--red)">Danger Zone</h3><button class="danger-btn" onclick="doLogout()">🚪 Sign Out of All Devices</button></div></section></div></main><nav id="tabbar"><button class="tbtn" onclick="window.location.href='../index.html'"><span class="tic">🏠</span>Home</button><button class="tbtn" onclick="window.location.href='search.html'"><span class="tic">🔍</span>Search</button><button class="tbtn" onclick="window.location.href='../index.html?tab=downloads'"><span class="tic">⬇</span>Downloads</button><button class="tbtn act"><span class="tic">👤</span>Profile</button></nav><script src="../app/api.js"></script><script src="../app/auth.js"></script><script src="../app/movies.js"></script><script src="../app/users.js"></script><script src="../app/playlist.js"></script><script>initProfilePage();</script></body></html>
