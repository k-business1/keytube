<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Playlist · KEYTUBE</title><link rel="icon" href="../imagelib/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style/main.css"><link rel="stylesheet" href="../style/pages.css"></head><body class="playlist-page"><div id="pbar"></div><div id="pgLoad"><div class="ld"><div class="kb kb-logo"><img src="../imagelib/logo.png" alt="K"></div><div class="ld-t">KEYTUBE</div><div class="spin"></div></div></div><div id="toast"></div><header id="hdr"><button class="hdr-back" onclick="goBack()">‹</button><div class="logo-t">My Playlist</div><div class="hdr-spacer"></div><div class="hdr-r"><div id="uChip" style="display:none"><div class="av" id="avEl" onclick="toggleDrop()">U</div></div></div></header><div id="udrop"><div class="di" onclick="cd();window.location.href='../index.html'">🏠 Home</div><div class="di" onclick="cd();window.location.href='profile.html'">👤 Profile</div><div class="ddiv"></div><div class="di red" onclick="doLogout()">🚪 Sign out</div></div><main class="playlist-main"><div class="playlist-hero-card" id="playlistHeroCard"><div class="ph-thumb" id="phThumb"><span>📋</span></div><div class="ph-info"><h2 id="phTitle">My Saved List</h2><p id="phCount" style="color:var(--t2);font-size:.82rem">0 videos</p><div class="ph-actions"><button class="ph-btn ph-btn-red" id="playAllBtn" onclick="playAll()">▶ Play All</button><button class="ph-btn ph-btn-out" onclick="shufflePlay()">🔀 Shuffle</button></div></div></div><div class="playlist-filters"><div class="pl-tabs"><button class="pltab active" id="pltab-saved" onclick="showPlTab('saved')">📋 Saved</button><button class="pltab" id="pltab-liked" onclick="showPlTab('liked')">❤️ Liked</button><button class="pltab" id="pltab-history" onclick="showPlTab('history')">🕐 History</button><button class="pltab" id="pltab-downloads" onclick="showPlTab('downloads')">⬇ Downloads</button></div></div><section class="pl-panel active" id="plpanel-saved"><div class="pl-sort-row"><select id="plSort" onchange="sortPlaylist(this.value)" aria-label="Sort playlist"><option value="added">Recently Added</option><option value="name">Name A-Z</option><option value="rating">Top Rated</option></select><span id="plCount" style="font-size:.8rem;color:var(--t2)"></span></div><div class="playlist-list" id="savedList"></div><div class="empty-st hidden" id="savedEmpty"><div class="ei">📋</div><p>Your saved list is empty</p><a href="../index.html" style="color:var(--blue);font-size:.82rem;margin-top:8px;display:block">Browse movies →</a></div></section><section class="pl-panel hidden" id="plpanel-liked"><div class="playlist-list" id="likedList"></div><div class="empty-st hidden" id="likedEmpty"><div class="ei">❤️</div><p>No liked videos yet</p></div></section><section class="pl-panel hidden" id="plpanel-history"><div class="playlist-list" id="historyList"></div><div class="empty-st hidden" id="historyEmpty"><div class="ei">🕐</div><p>No watch history yet</p></div></section><section class="pl-panel hidden" id="plpanel-downloads"><div class="playlist-list" id="downloadsList"></div><div class="empty-st hidden" id="downloadsEmpty"><div class="ei">⬇</div><p>No downloads yet</p></div></section></main><nav id="tabbar"><button class="tbtn" onclick="window.location.href='../index.html'"><span class="tic">🏠</span>Home</button><button class="tbtn" onclick="window.location.href='search.html'"><span class="tic">🔍</span>Search</button><button class="tbtn" onclick="window.location.href='../index.html?tab=downloads'"><span class="tic">⬇</span>Downloads</button><button class="tbtn act"><span class="tic">📋</span>My List</button></nav><div id="loginReq"><div class="lr-box"><div style="font-size:2rem;margin-bottom:7px">🔒</div><h3>Sign in required</h3><p>Sign in to view your playlist.</p><div class="lr-bar"><div class="lr-fill"></div></div><button class="auth-btn" onclick="window.location.href='login.html'">Sign In</button></div></div><script src="../app/api.js"></script><script src="../app/auth.js"></script><script src="../app/movies.js"></script><script src="../app/playlist.js"></script><script>initPlaylistPage();</script></body></html>
