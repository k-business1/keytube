<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Unmatched AI Questions - Admin Dashboard</title><link rel="icon" href="../imagelib/logo.png"><link rel="stylesheet" href="../style/question.css"></head><body><div style="max-width:1100px;margin:0 auto;padding:0 16px 40px"><div class="ai-card" id="unknownSection"><div class="ai-card-title" style="justify-content:space-between"><span>❓ Unanswered Questions<span id="pendingBadge" style="display:none;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle"></span></span><div style="display:flex;gap:7px"><select id="qFilter" class="fi" style="max-width:150px;padding:5px 9px;font-size:.77rem" onchange="filterQuestions(this.value)"><option value="all">All</option><option value="pending">Pending</option><option value="answered">Answered</option><option value="ignored">Ignored</option></select><button class="ai-btn ai-btn-out" style="padding:5px 12px;font-size:.77rem" onclick="loadUnknownQuestions()">↺ Refresh</button></div></div><p style="font-size:.79rem;color:var(--t2);margin-bottom:14px;line-height:1.5">When users ask something the AI cannot answer, the question is saved here. You can <strong>create a key term</strong> to teach the AI or <strong>ignore</strong> irrelevant questions.</p><div id="unknownList"></div><div id="unknownEmpty" style="display:none;text-align:center;padding:32px;color:var(--t2)"><div style="font-size:2rem;margin-bottom:8px;opacity:.3">🎉</div><p style="font-size:.83rem">No unanswered questions!</p><p style="font-size:.76rem;margin-top:4px;opacity:.7">The AI is answering everything perfectly.</p></div></div></div><div class="modal-bg" id="convertModal" style="display:none;"><div class="modal-box"><div class="modal-hd"><h3>🔑 Teach AI — Create Answer</h3><button class="modal-close" onclick="closeConvertModal()">✕</button></div><div style="background:rgba(108,63,197,.06);border:1px solid rgba(108,63,197,.2);border-radius:var(--r2px);padding:10px 12px;margin-bottom:14px;font-size:.8rem"><strong>User asked:</strong> <span id="convertOrigQ" style="color:var(--ai)"></span></div><input type="hidden" id="convertQId"><div class="fg"><label>Keywords * <span style="font-weight:400;text-transform:none;color:var(--t3)">(comma-separated — include the user's exact wording)</span></label><input class="fi" id="convertKeywords" type="text" placeholder="e.g. how to watch offline, download video"></div><div class="fg"><label>AI Response *</label><textarea class="fi fi-ta" id="convertResponse" rows="5" placeholder="Type the answer the AI should give…"></textarea></div><div class="fg"><label>DataFetch <span style="font-weight:400;text-transform:none;color:var(--t3)">(optional — for live data placeholders)</span></label><input class="fi" id="convertDataFetch" type="text" placeholder="e.g. total_movies"></div><div class="fg"><label>Category</label><select class="fi fi-sel" id="convertCategory"><option value="general">🌐 General</option><option value="greeting">👋 Greeting</option><option value="movies">🎬 Movies</option><option value="channels">📺 Channels</option><option value="help">❓ Help</option><option value="earnings">💰 Earnings</option><option value="support">🛠 Support</option></select></div><div class="btn-row"><button class="ai-btn ai-btn-ai" onclick="saveConvertedKeyTerm()">✅ Create Key Term & Mark Answered</button><button class="ai-btn ai-btn-out" onclick="closeConvertModal()">Cancel</button></div></div></div><script src="../app/api.js"></script><script src="../app/auth.js"></script><script src="../app/question.js"></script></body></html>
