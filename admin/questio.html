<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmatched AI Questions - Admin Dashboard</title>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="../style/question.css">
</head>
<body>

  <div class="admin-section">
    <div class="section-header">
      <h3>🤖 Unmatched AI Questions</h3>
      <button class="btn-refresh" onclick="loadUnmatchedQuestions()">🔄 Refresh</button>
    </div>
    
    <div class="table-container">
      <table id="unmatchedTable">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User Question</th>
          </tr>
        </thead>
        <tbody id="unmatchedTableBody">
          <tr>
            <td colspan="2" class="loading-text">Loading unmatched questions...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Application Modules -->
  <script src="../app/api.js"></script>
  <script src="../app/auth.js"></script>
  <script src="../app/question.js"></script>
</body>
</html>
