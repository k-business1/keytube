<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEYTUBE Admin</title><link rel="icon" href="../imagelib/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style/admin.css"></head><body><div id="pbar"></div><div id="toast"></div><div id="loginScreen"><div class="ls-card"><div class="ls-logo"><div class="ls-kb"><img src="../imagelib/logo.png" alt="K" onerror="this.parentNode.innerHTML='<span>K</span>'"></div><span class="ls-brand">KEYTUBE</span></div><div class="ls-title">🔐 Admin Panel</div><div class="ls-sub">Enter your admin password to continue</div><div class="ls-fg"><label>Admin Password</label><input class="ls-fi" id="adPw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAdminLogin()"></div><div class="ls-err" id="adErr"></div><button class="ls-btn" id="loginBtn" onclick="doAdminLogin()">→ Enter Admin Panel</button><div class="ls-back">← <a onclick="window.location.href='../index.html'" style="color:var(--blue);cursor:pointer">Back to KEYTUBE</a></div></div></div><div id="admPanel"><div class="abar"><div class="abar-logo"><div class="abar-kb"><img src="../imagelib/logo.png" alt="K" onerror="this.parentNode.innerHTML='<span>K</span>'"></div><span class="abar-title">KEYTUBE ADMIN</span></div><button class="atb act" id="tab-dash" onclick="aTab('dash')">📊 Dashboard</button><button class="atb" id="tab-movies" onclick="aTab('movies')">🎬 Movies</button><button class="atb" id="tab-users" onclick="aTab('users')">👥 Users</button><button class="atb" id="tab-comments" onclick="aTab('comments')">💬 Comments</button><button class="atb" id="tab-notif" onclick="aTab('notif')">🔔 Notifications</button><button class="atb" id="tab-pages" onclick="aTab('pages')">📄 Pages</button><button class="atb" id="tab-traffic" onclick="aTab('traffic')">📈 Traffic</button><button class="atb" id="tab-settings" onclick="aTab('settings')">⚙️ Settings</button><a href="../pages/upload.html" class="upload-btn">📤 Upload</a><div class="abar-sp"></div><span class="abar-user" id="abarUser"></span><button class="atb atb-logout" onclick="doLogout()">🚪 Logout</button></div><div class="abody" id="aBody"><div class="spin"></div></div></div><script src="admin.js"></script></body></html>
