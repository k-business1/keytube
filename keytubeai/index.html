<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KeyTube AI Assistant</title><link rel="stylesheet" href="ai.css"></head><body><section class="info-card ai-chat-card"><div class="ai-chat-header"><div class="ai-chat-header-av"><img src="../imagelib/ailogo.png" alt="AI" onerror="this.src='../imagelib/logo.png'"><div class="ai-online-dot"></div></div><div class="ai-chat-header-info"><div class="ai-chat-header-name">KEYTUBE AI</div><div class="ai-chat-header-status">Always online · Instant answers</div></div><button class="ai-clear-btn" onclick="clearAIChat()" title="Clear chat">🗑</button></div><div class="ai-suggestions-wrap" id="aiSuggestions"></div><div class="ai-chat-window" id="aiChat"></div><div class="ai-input-bar"><textarea id="aiInput" class="ai-textarea" placeholder="Ask me anything — movies, channels, how to earn…" rows="1" onkeydown="aiKeyDown(event)" oninput="autoResize(this)"></textarea><button class="ai-send-btn" onclick="sendAIMessage()" title="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button></div><div class="ai-footer-note">🔒 AI does not share private information. Powered by KEYTUBE AI.</div></section><script src="../app/api.js"></script><script src="../app/auth.js"></script><script src="../app/ai.js"></script></body></html>
