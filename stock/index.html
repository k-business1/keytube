<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/ff3cq23a/image/upload/w_200,h_200,c_fill,q_auto,f_auto/v1790200494/Organic_coffee/zslkkrr30zylb8durjbj.png">
<title>Stock Manager</title>
<style>
:root{--g:#146c43;--g2:#198754;--dk:#10251b;--m:#6b7280;--l:#e5e7eb;--r:#dc3545;--w:#b7791f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f7f5;color:#142019}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%}
.hidden{display:none!important}.muted{color:var(--m);font-size:12px}.error{color:var(--r);font-size:13px;margin-top:8px;min-height:1em}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;height:52px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;object-fit:cover;background:#e9f6ef;flex:none;display:grid;place-items:center;font-weight:800;color:var(--g)}
.title{font-weight:850;line-height:1.1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{position:sticky;top:52px;z-index:19;background:#fff;border-bottom:1px solid var(--l);display:flex;gap:2px;padding:4px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#4b5563}
.tabs a.on{background:#e9f6ef;color:var(--g)}
main{max-width:1100px;margin:auto;padding:8px 10px 100px}
.ic{flex:none;display:block}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:750;font-size:13px;background:#edf2ef;color:var(--dk);display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--g2);color:#fff}.btn-d{background:#fdecee;color:var(--r)}.btn:disabled{opacity:.55;cursor:not-allowed}
.field{margin:10px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--l);background:#fff;padding:10px;font-size:15px;border-radius:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:12px;box-shadow:0 6px 24px rgba(16,37,27,.10)}
.section{margin-top:12px}
.head,.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head{margin-bottom:10px}
.h1{font-size:19px;font-weight:850;margin:4px 0 2px}.h2{font-weight:800;font-size:14px}
.ttl{display:inline-flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.stat{display:flex;align-items:center;gap:8px;padding:10px;color:inherit}
.stx{display:flex;flex-direction:column;min-width:0;flex:1}
.stat .t{font-size:12px;font-weight:700;color:#4b5563}.stat .v{font-size:19px;font-weight:850;line-height:1.15;margin:1px 0;word-break:break-word;color:#0f1f17}.stat .l{font-size:11px;color:var(--m)}
.chev{color:#9ca3af;display:grid;place-items:center;flex:none}
.sic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}.sic.sm{width:28px;height:28px;border-radius:8px}
.c-green{background:#dff3e7;color:#198754}.c-blue{background:#dbe8ff;color:#3b6fe0}.c-orange{background:#fff0d1;color:#f59e0b}.c-purple{background:#ece4ff;color:#7c4dff}.c-teal{background:#d9f3ec;color:#14a08a}.c-pink{background:#ffe3ea;color:#e0245e}
.thumb{position:relative;overflow:hidden;width:26px;height:26px;border-radius:50%;background:#e9f6ef;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--g)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.st{display:grid;grid-template-columns:16px minmax(0,1fr) 62px 80px 10px;align-items:center;gap:5px;padding:8px 6px;font-size:11.5px}
.st-h{background:rgba(0,0,0,.05);border-radius:10px;font-size:11px;font-weight:700;color:var(--m)}
.st-r{border-bottom:1px solid var(--l)}.st-r:last-child{border:0}
.st .who b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-style:normal;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:#dcf5e6;color:#0f8a4b}.pill.low{background:#fff4d6;color:var(--w)}.pill.out{background:#fdecee;color:var(--r)}
.low{color:var(--r)}
.srow{padding:10px 0;border-bottom:1px solid var(--l)}.srow:last-child{border:0}
.bar{height:9px;border-radius:9px;background:#e9f6ef;overflow:hidden;display:flex;margin-top:5px}.bar i{display:block;height:100%}
.b-sold{background:var(--g2)}.b-rem{background:#b9dfc9}
.chart-row{margin:10px 0}.chart-row .line{font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--m);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}
.col i{display:block;width:100%;max-width:38px;background:var(--g2);border-radius:8px 8px 0 0;min-height:3px}.col span{margin-top:5px;color:var(--m)}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--l);font-size:12px}th{font-size:11px;text-transform:uppercase;color:var(--m)}
.preview{width:100px;height:100px;border-radius:14px;object-fit:cover;margin-top:8px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:50}
.mcard{background:#fff;border-radius:22px;padding:22px;width:min(430px,100%);max-height:92vh;overflow:auto}
.mcard .brand{justify-content:center;flex-direction:column;text-align:center;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#17251e;color:#fff;padding:11px 16px;border-radius:12px;z-index:100;max-width:90%;font-size:12px}
.spin{padding:50px;text-align:center;color:var(--m)}
.bnav{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;display:flex;justify-content:space-around;max-width:640px;margin:0 auto;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--m);padding:5px 0;position:relative}
.bnav a.on{color:var(--g2);font-weight:700}.bnav a.on::after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:3px;background:var(--g2)}
.greet{padding:18px 2px 0;color:var(--dk)}.gl{width:28px;height:3px;border-radius:3px;background:#22c55e;margin:8px 0}
.g1{font-size:18px}.g2{font-size:28px;font-weight:850;line-height:1.1}.g3{font-size:12.5px;margin-top:6px}.g4{display:flex;align-items:center;gap:8px;font-size:12px}
html.bgmode{background:#10251b}
html.bgmode::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.35)),var(--bg-img) center/cover no-repeat}
html.bgmode body{background:transparent}
html.bgmode .top,html.bgmode .tabs{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.25)}
html.bgmode .title,html.bgmode .top .muted,html.bgmode .tabs a{color:#fff}html.bgmode .tabs a.on{background:var(--g2)}
html.bgmode .top .btn:not(.btn-p){background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)}
html.bgmode .card{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html.bgmode .greet{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#toolManagerBtn{display:none;position:fixed;right:14px;bottom:88px;z-index:40;box-shadow:0 8px 25px rgba(0,0,0,.2)}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="spin">Loading…</div></div>
<div id="modal"></div>
<div id="toast" class="toast hidden"></div>
<button id="toolManagerBtn" class="btn btn-p" type="button">🧰 Tool Manager</button>

<script>
(function () {
"use strict";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmACZXgLo_Iq6vSfO4zPpzQBBUtMOvHViNNUs2OhPMpTDQaX7DbWmUoJa6RYaRd4PzXg/exec";
const OWNER = "kim";
let BOOT = { appName: "Stock Manager", currency: "RWF", cloud: "", preset: "", folder: "", units: ["item", "kg", "L"] };
const PUBLIC = ["home", "analytics"], ADMIN = ["products", "sale", "settings"];
const TITLES = { home: "Home", analytics: "Analytics", products: "Products", sale: "Sales", settings: "Settings" };
const h0 = (location.hash || "").slice(1);
const S = { page: TITLES[h0] ? h0 : "home", want: null, d: null, q: "", token: store("get"), busy: false };
window.getStockAdmin = () => !!(S.d && S.d.admin === true);

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  analytics: '<rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/>',
  products: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  sale: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 001 .8h8.9a1 1 0 001-.8L21 7H6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  check: '<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.5 12.5l3 3 6-7" stroke="#fff"/>',
  coins: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const ic = (n, s) => `<svg class="ic" viewBox="0 0 24 24" width="${s || 22}" height="${s || 22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;

function store(op, v) {
  try {
    if (op === "get") return localStorage.getItem("stock_token") || "";
    if (op === "set") localStorage.setItem("stock_token", v);
    if (op === "del") localStorage.removeItem("stock_token");
  } catch (e) {}
  return "";
}
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const num = v => Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 3 });
const money = v => Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " " + BOOT.currency;
const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); };
const small = u => u ? String(u).replace("/upload/", "/upload/w_200,h_200,c_fill,q_auto,f_auto/") : "";
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
const cap = s => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);
const today = () => new Date().toISOString().slice(0, 10);
const qu = (n, p) => { const u = (p && p.unit) || "item"; return num(n) + " " + (u === "item" && Number(n) !== 1 ? "items" : u); };
const isOwner = () => !!(S.d && S.d.admin && S.d.username === OWNER);
let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.remove("hidden"); clearTimeout(tt); tt = setTimeout(() => t.classList.add("hidden"), 3200); }

function api(action, p) {
  return fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({}, p || {}, { action: action, token: S.token })) })
    .then(r => r.json())
    .then(r => { if (r && r.ok) return r; if (r && r.auth) dropSession(); throw new Error((r && r.msg) || "Request failed"); },
      () => { throw new Error("Cannot reach the server. Check internet and that the Web app access is Anyone."); });
}
function dropSession() { S.token = ""; store("del"); if (S.d) S.d.admin = false; updateToolManager(); }
async function upload(file) {
  if (!file) throw new Error("Choose a file");
  if (!BOOT.cloud || !BOOT.preset) throw new Error("Cloudinary is not configured");
  const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", BOOT.preset);
  if (BOOT.folder) fd.append("folder", BOOT.folder);
  const j = await (await fetch("https://api.cloudinary.com/v1_1/" + encodeURIComponent(BOOT.cloud) + "/image/upload", { method: "POST", body: fd })).json();
  if (!j.secure_url) throw new Error((j.error && j.error.message) || "Image upload failed");
  return j.secure_url;
}

async function load() {
  const r = await api("load");
  if (r.expired) dropSession();
  if (r.config) BOOT = Object.assign(BOOT, r.config);
  S.d = r; updateToolManager(); return r;
}
async function refresh() { await load(); go(S.page); }

function go(page) {
  if (!TITLES[page]) page = "home";
  if (ADMIN.includes(page) && !(S.d && S.d.admin)) { S.want = page; page = "home"; if (S.d) openLogin(); }
  S.page = page;
  try { history.replaceState(null, "", "#" + page); } catch (e) {}
  if (S.d) { shell(); view(); window.scrollTo(0, 0); }
}
function shell() {
  const d = S.d, a = d.admin, st = d.settings || {};
  const logo = st.logoUrl ? `<img class="logo" src="${esc(small(st.logoUrl))}" alt="">` : `<div class="logo">${esc(BOOT.appName.charAt(0))}</div>`;
  const pages = PUBLIC.concat(a ? ADMIN : []);
  const tab = (p, s) => `<a href="#${p}" data-page="${p}" class="${S.page === p ? "on" : ""}">${ic(p, s)}<span>${TITLES[p]}</span></a>`;
  $("#app").innerHTML = `<header class="top"><div class="brand">${logo}<div><div class="title">${esc(BOOT.appName)}</div><div class="muted">${a ? "Admin: " + esc(cap(d.username)) : "Stock overview"}</div></div></div>
  ${a ? `<button class="btn" data-act="logout">${ic("logout", 16)} Logout</button>` : `<button class="btn btn-p" data-act="login-open">Login</button>`}</header>
  <nav class="tabs">${pages.map(p => tab(p, 16)).join("")}</nav><main id="view"></main><nav class="bnav">${pages.map(p => tab(p, 19)).join("")}</nav>`;
  updateToolManager();
}
function applyBg() {
  const u = S.d && S.d.settings && S.d.settings.backgroundUrl, on = S.page === "home" && !!u;
  document.documentElement.classList.toggle("bgmode", on);
  if (on) document.documentElement.style.setProperty("--bg-img", 'url("' + String(u).replace(/["\\\n\r]/g, "") + '")');
}
function view() {
  applyBg();
  ({ home: home, analytics: analytics, products: products, sale: sale, settings: settings }[S.page] || home)($("#view"), S.d);
  updateToolManager();
}

/* ---------- shared ---------- */
const thumb = p => `<div class="thumb">${esc(String(p.name || "?").charAt(0).toUpperCase())}${p.imageUrl ? `<img src="${esc(small(p.imageUrl))}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}</div>`;
const pill = p => `<i class="pill ${p.status}">${{ ok: "In stock", low: "Low", out: "Out" }[p.status] || ""}</i>`;
const stat = (l, v, sub, i, c, pg) => `<a class="card stat" href="#${pg}" data-page="${pg}"><span class="sic ${c}">${ic(i, 19)}</span><span class="stx"><span class="t">${l}</span><span class="v">${v}</span><span class="l">${sub || ""}</span></span><span class="chev">${ic("chev", 14)}</span></a>`;
function bars(items) {
  if (!items.length) return '<div class="muted">No products yet.</div>';
  return '<div class="legend"><span><i class="b-sold"></i>Sold</span><span><i class="b-rem"></i>Remaining</span></div>' +
    items.map(p => { const t = p.purchased || 1, s = Math.min(100, p.sold / t * 100);
      return `<div class="chart-row"><div class="line"><span>${esc(p.name)}</span><b>${qu(p.sold, p)} sold · ${qu(p.remaining, p)} left</b></div><div class="bar"><i class="b-sold" style="width:${s}%"></i><i class="b-rem" style="width:${Math.max(0, 100 - s)}%"></i></div></div>`; }).join("");
}
const emptyBox = () => `<div class="card muted">No products yet. ${S.d.admin ? '<a href="#products" data-page="products"><b>Add the first product</b></a>' : ""}</div>`;
const matches = (p, q) => !q || String(p.name).toLowerCase().includes(q) || String(p.id).toLowerCase().includes(q);

/* ---------- HOME (no "total products" card) ---------- */
function home(v, d) {
  const all = d.products || [], st = d.stats || {}, a = d.admin;
  const list = all.filter(p => matches(p, S.q.toLowerCase()));
  const h = new Date().getHours(), hi = h < 12 ? "Good Morning" : h < 18 ? "Good Afternoon" : "Good Evening";
  v.innerHTML = `<div class="greet"><div class="gl"></div><div class="g1">${hi},</div><div class="g2">${esc(a ? cap(d.username) : "Welcome")}</div>
  <div class="g3">Manage your stock, track sales and grow your business.</div><div class="gl"></div>
  <div class="g4">${ic("cal", 18)}<span>Today: ${esc(new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" }))}</span></div></div>
  <div class="stats section">
   ${stat("Low stock", num(st.lowStock), "products", "trend", "c-orange", "analytics")}
   ${stat("Out of stock", num(st.outOfStock), "products", "check", "c-pink", "analytics")}
   ${a ? stat("Stock value", money(st.stockValue), "remaining goods", "coins", "c-teal", "products") + stat("Sales today", money(st.salesToday), num(st.salesTodayCount) + " sale(s)", "sale", "c-blue", "sale") + stat("Sales this month", money(st.salesMonth), "", "trend", "c-purple", "sale") + stat("All sales", money(st.salesAll), "total sold", "coins", "c-green", "sale") : ""}
  </div>
  <div class="card section"><div class="head"><span class="h2 ttl"><span class="sic sm c-green">${ic("products", 16)}</span>All stock</span><span class="muted" id="cnt">${list.length} of ${all.length}</span></div>
  <input id="q" placeholder="Search product…" value="${esc(S.q)}" autocomplete="off" style="margin-bottom:6px"><div id="stockList">${stockRows(list, d)}</div></div>
  <div class="card section"><div class="head"><span class="h2">Sold vs remaining</span><a class="btn" href="#analytics" data-page="analytics">More analytics</a></div>${bars(all)}</div>`;
  const qi = $("#q");
  qi.addEventListener("input", () => { S.q = qi.value; const l = all.filter(p => matches(p, S.q.toLowerCase())); $("#stockList").innerHTML = stockRows(l, d); $("#cnt").textContent = l.length + " of " + all.length; });
}
function stockRows(list, d) {
  if (!list.length) return (d.products || []).length ? '<div class="muted" style="padding:12px 0">No match.</div>' : emptyBox();
  return '<div class="st st-h"><span>#</span><span>Product</span><span>Quantity</span><span>Status</span><span></span></div>' +
    list.map((p, i) => `<div class="st st-r"><span>${i + 1}</span><span class="who">${thumb(p)}<b>${esc(p.name)}</b></span><span>${qu(p.remaining, p)}</span><span>${pill(p)}</span><span class="chev">${ic("chev", 14)}</span></div>`).join("");
}

/* ---------- ANALYTICS + PDF report ---------- */
const reportCard = () => `<div class="card section"><div class="h2">Sales report (PDF)</div><div class="muted">Date, item, seller, quantity, price, total and description</div>
   <div class="row2"><div class="field"><label for="rf">From</label><input id="rf" type="date"></div><div class="field"><label for="rt">To</label><input id="rt" type="date" value="${today()}"></div></div>
   <div class="field"><label for="rs">Seller</label><select id="rs"><option value="">All</option><option value="kim">Kim</option><option value="grace">Grace</option></select></div>
   <button class="btn btn-p" data-act="pdf">Download PDF</button><div class="error" id="rperr"></div></div>`;

  const low = (d.products || []).filter(p => p.status !== "ok").sort((a, b) => a.remaining - b.remaining);

  <div class="card section"><div class="h2" style="margin-bottom:8px">Low / out of stock</div>${low.length ? low.map(p => `<div class="srow line"><div class="who">${thumb(p)}<div><b>${esc(p.name)}</b> ${pill(p)}</div></div><b class="low">${qu(p.remaining, p)} left</b></div>`).join("") : '<div class="muted">All products are well stocked.</div>'}</div>

async function makePdf(btn) {

    const file = $("#pf").files[0], imageUrl = file ? await upload(file) : "";

/* ---------- SALES ---------- */
function sale(v, d) {
  const list = (d.products || []).filter(p => p.remaining > 0), recent = d.sales || [], own = isOwner();
  v.innerHTML = `<div class="h1">Record sale</div><div class="muted">Stock reduces automatically</div>
  <div class="card section"><div class="h2">Quick sale</div><div class="muted">Several products at once, separated by commas. Example: Coffee Beans 2, Soap 1, Rice 3.5 &nbsp;·&nbsp; Part of a bar by money: Soap 400 rwf</div>
   <div class="field"><textarea id="qs" rows="2" placeholder="Coffee Beans 2, Soap 1, Rice 3" autocomplete="off"></textarea></div>
   <button class="btn btn-p" data-act="quick-sale">Sell all</button><div class="error" id="qerr"></div></div>
  <div class="card section">
   <div class="field"><label for="sp">Product</label><select id="sp">${list.length ? list.map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${qu(p.remaining, p)} left)</option>`).join("") : '<option value="">No stock available</option>'}</select></div>
   <div class="field"><label for="sm">Sell by</label><select id="sm"><option value="qty">Quantity (whole or part, e.g. 0.5)</option><option value="amt">Amount paid (${esc(BOOT.currency)}) – for parts</option></select></div>
   <div class="row2"><div class="field" id="fq"><label for="sq" id="sql">Quantity</label><input id="sq" type="number" min="0" step="any" value="1" inputmode="decimal"></div>
   <div class="field hidden" id="fa"><label for="sa">Amount paid (${esc(BOOT.currency)})</label><input id="sa" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 400"></div>
   <div class="field"><label for="spr" id="sprl">Unit price</label><input id="spr" type="number" min="0" step="any" inputmode="decimal"></div></div>
   <div class="muted" id="sprev" style="margin-bottom:6px"></div>
   <div class="field"><label for="sx">Description (optional)</label><input id="sx" placeholder="customer, note…" autocomplete="off"></div>
   <div class="field"><label for="sd">Date</label><input id="sd" type="date" value="${today()}"></div>
   <button class="btn btn-p" data-act="record-sale" ${list.length ? "" : "disabled"}>Record sale</button><div class="error" id="serr"></div></div>
  <div class="card section"><div class="head"><span class="h2">Recent sales</span><span class="muted">last 30</span></div>
  ${recent.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total</th><th>Seller</th><th>Description</th>${own ? "<th></th>" : ""}</tr></thead><tbody>
  ${recent.slice(0, 30).map(s => `<tr><td>${esc(when(s.date))}</td><td>${esc(s.name)}</td><td>${num(s.qty)} ${esc(s.unit)}</td><td>${money(s.total)}</td><td>${esc(cap(s.seller))}</td><td>${esc(s.description)}</td>${own ? `<td><button class="btn btn-d" data-act="del-sale" data-id="${esc(s.id)}">✕</button></td>` : ""}</tr>`).join("")}
  </tbody></table></div>` : '<div class="muted">No sales yet.</div>'}</div>`;
  const sp = $("#sp"), fill = () => { const p = list.find(x => String(x.id) === sp.value); $("#sql").textContent = "Quantity" + (p ? " (" + p.unit + ")" : ""); $("#sprl").textContent = "Price per " + (p ? p.unit : "unit") + " (" + BOOT.currency + ")"; $("#spr").value = p ? p.costPerUnit : ""; };
  sp.addEventListener("change", fill); fill();
  const calc = () => {
    const p = list.find(x => String(x.id) === sp.value), pr = Number(val("spr")), by = val("sm") === "amt", out = $("#sprev");
    $("#fq").classList.toggle("hidden", by); $("#fa").classList.toggle("hidden", !by);
    if (!p || !(pr > 0)) { out.textContent = ""; return; }
    const q = by ? Number(val("sa")) / pr : Number(val("sq"));
    if (!isFinite(q) || q <= 0) { out.textContent = ""; return; }
    const left = p.remaining - q;
    out.textContent = (by ? "= " + num(q) + " " + p.unit + " · " : "= " + money(q * pr) + " · ") + (left < 0 ? "not enough stock" : num(left) + " " + p.unit + " left · stock worth " + money(left * pr));
  };
  ["sp", "sm", "sq", "sa", "spr"].forEach(i => { $("#" + i).addEventListener("input", calc); $("#" + i).addEventListener("change", calc); });
  calc();
}
async function recordSale(btn) {
  const err = $("#serr"); err.textContent = "";
  const id = val("sp"), byAmt = val("sm") === "amt", amt = Number(val("sa")), qty = Number(val("sq"));
  const p = ((S.d && S.d.products) || []).find(x => String(x.id) === id);
  if (!id) { err.textContent = "Choose a product"; return; }
  if (byAmt) { if (!isFinite(amt) || amt <= 0) { err.textContent = "Enter the amount paid"; return; } }
  else if (!isFinite(qty) || qty <= 0) { err.textContent = "Enter a quantity greater than zero"; return; }
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await api("recordSale", Object.assign({ productId: id, unitPrice: val("spr"), description: val("sx"), date: val("sd") }, byAmt ? { amount: amt } : { quantity: qty }));
    await refresh(); toast("Sale recorded · " + num(r.remaining) + " left");
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Record sale"; }
}
function parseItem(seg, list) {
  const t = seg.toLowerCase(), m = t.match(/(\d+(?:\.\d+)?)/);
  if (!m) return { err: "No quantity in: " + seg.trim() };
  const byAmt = /\b(rwf|frw|rf)\b/.test(t), n = Number(m[1]);
  const words = t.replace(m[0], " ").replace(/\b(ngurishije|nagurishije|sold|sell|rwf|frw|rf|kg|g|l|ml|litres?|liters?|items?|ibintu|ikilo|amakilo|box|bag|dozen)\b/g, " ").replace(/\s+/g, " ").trim();
  let best = null, score = 0;
  list.forEach(p => {
    const nm = String(p.name).toLowerCase(); let sc = 0;
    if (words && nm === words) sc = 3;
    else if (words && (nm.includes(words) || words.includes(nm))) sc = 2;
    else { const w = words.split(" ").filter(x => x.length > 2); sc = w.filter(x => nm.includes(x)).length / Math.max(1, w.length); }
    if (sc > score) { score = sc; best = p; }
  });
  if (!best || score < 0.5) return { err: 'Product not found: "' + (words || seg.trim()) + '"' };
  return { p: best, qty: byAmt ? null : n, amount: byAmt ? n : null };
}
/* "Coffee Beans 2, Soap 1, Rice 3"  or  "Soap 400 rwf" (separate with comma, new line, + or "na") */
function parseSale(text, list) {
  const parts = text.replace(/(\d),(\d)/g, "$1.$2").split(/[,;\n+]|\s+(?:na|and)\s+/i).map(x => x.trim()).filter(Boolean);
  if (!parts.length) return { err: "Type the products and quantities. Example: Coffee Beans 2, Soap 1" };
  const items = [];
  for (const seg of parts) { const r = parseItem(seg, list); if (r.err) return r; items.push(r); }
  return { items: items };
}
async function quickSale(btn) {
  const err = $("#qerr"); err.textContent = "";
  const r = parseSale(val("qs"), (S.d && S.d.products) || []);
  if (r.err) { err.textContent = r.err; return; }
  const used = {}, lines = []; let sum = 0;
  for (const it of r.items) {
    const p = it.p, price = Number(p.costPerUnit);
    if (it.amount != null && !(price > 0)) { err.textContent = p.name + ": no price set"; return; }
    const q = it.amount != null ? it.amount / price : it.qty, tot = it.amount != null ? it.amount : q * price;
    used[p.id] = (used[p.id] || 0) + q;
    if (used[p.id] > p.remaining + 1e-9) { err.textContent = p.name + ": only " + qu(p.remaining, p) + " left"; return; }
    sum += tot;
    lines.push("• " + p.name + ": " + (it.amount != null ? num(q) + " " + p.unit : qu(q, p)) + " = " + money(tot));
  }
  if (!confirm("Sell these " + r.items.length + " product(s)?\n\n" + lines.join("\n") + "\n\nTotal: " + money(sum))) return;
  btn.disabled = true;
  try {
    const x = await api("recordSales", { items: r.items.map(it => ({ productId: it.p.id, quantity: it.qty, amount: it.amount })) });
    await refresh(); toast(x.count + " sale(s) recorded · " + money(x.total));
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
}

/* ---------- login / logout ---------- */
function openLogin() {
  $("#modal").innerHTML = `<div class="modal" data-act="login-close"><div class="mcard" data-stop="1">
  <div class="brand"><div class="logo">${esc(BOOT.appName.charAt(0))}</div><div class="title">Login</div></div>
  <div class="field"><label for="lu">Username</label><select id="lu"><option value="kim">kim</option><option value="grace">grace</option></select></div>
  <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
  <button class="btn btn-p" style="width:100%;justify-content:center" data-act="login">Login</button><div class="error" id="lerr"></div>
  <button class="btn" style="width:100%;justify-content:center;margin-top:6px" data-act="login-close">Cancel</button></div></div>`;
  $("#lp").addEventListener("keydown", e => { if (e.key === "Enter") doLogin($("[data-act=login]")); });
  setTimeout(() => { const p = $("#lp"); if (p) p.focus(); }, 50);
}
function closeLogin() { $("#modal").innerHTML = ""; S.want = null; }
async function doLogin(btn) {
  const err = $("#lerr"); err.textContent = "";
  if (!val("lp")) { err.textContent = "Enter your password"; return; }
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await api("login", { username: val("lu"), password: val("lp") });
    S.token = r.token; store("set", r.token);
    const target = S.want || "home"; $("#modal").innerHTML = ""; S.want = null;
    await load(); go(target);
    if (r.usingDefaultPassword) toast("Welcome! Please change your default password in Settings.");
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Login"; }
}
async function doLogout() { try { await api("logout"); } catch (e) {} dropSession(); try { await load(); } catch (e) {} go("home"); }

function updateToolManager() {
  const btn = document.getElementById("toolManagerBtn");
  if (btn) btn.style.display = (S && S.d && S.d.admin === true) ? "block" : "none";
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const a = e.target.closest("a[data-page]");
  if (a) { e.preventDefault(); go(a.dataset.page); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "login-close" && el.classList.contains("modal") && e.target !== el) return;
  if (S.busy) return;
  const id = el.dataset.id;
  const run = async f => { S.busy = true; try { await f(); } catch (x) { toast(x.message || "Error"); } S.busy = false; };
  if (act === "login-open") openLogin();
  else if (act === "login-close") closeLogin();
  else if (act === "login") run(() => doLogin(el));
  else if (act === "logout") run(doLogout);
  else if (act === "add-product") run(() => addProduct(el));
  else if (act === "record-sale") run(() => recordSale(el));
  else if (act === "quick-sale") run(() => quickSale(el));
  else if (act === "save-brand") run(() => saveBrand(el));
  else if (act === "change-pw") run(() => changePw(el));
  else if (act === "pdf") run(() => makePdf(el));
  else if (act === "add-stock") run(async () => { const q = prompt("Quantity to add:"); if (!q) return; await api("addStock", { id: id, qty: q }); await refresh(); toast("Stock added"); });
  else if (act === "set-price") run(async () => { const q = prompt("New price per unit:"); if (!q) return; await api("updateProduct", { id: id, unitPrice: q }); await refresh(); toast("Price updated"); });
  else if (act === "del-product") run(async () => { if (!confirm("Delete this product?")) return; await api("deleteProduct", { id: id }); await refresh(); toast("Deleted"); });
  else if (act === "del-sale") run(async () => { if (!confirm("Delete this sale?")) return; await api("deleteSale", { id: id }); await refresh(); toast("Deleted"); });
  else if (act === "reset-grace") run(async () => { if (!confirm("Reset Grace's password to the default?")) return; const r = await api("resetPassword", { username: "grace" }); toast(r.msg); });
});
document.getElementById("toolManagerBtn").addEventListener("click", function () {
  if (!(S && S.d && S.d.admin === true)) { updateToolManager(); return; }
  window.location.href = "tools.html";
});

/* ---------- start ---------- */
(async function start() {
  try { await load(); go(S.page); }
  catch (e) {
    $("#app").innerHTML = `<div class="spin">Could not load data.<div class="error">${esc(e.message)}</div><button class="btn btn-p" id="retry">Retry</button></div>`;
    $("#retry").addEventListener("click", () => location.reload());
  }
})();
})();
</script>
