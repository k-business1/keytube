<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png"
      href="https://res.cloudinary.com/ff3cq23a/image/upload/w_200,h_200,c_fill,q_auto,f_auto/v1790200494/Organic_coffee/zslkkrr30zylb8durjbj.png">
<title>Stock Manager</title>

<style>
:root{--green:#146c43;--green2:#198754;--dark:#10251b;--muted:#6b7280;--bg:#f4f7f5;--card:#fff;--line:#e5e7eb;--danger:#dc3545;--warn:#b7791f;--radius:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#142019}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.error{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;height:61px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;object-fit:cover;background:#e9f6ef;flex:none;display:grid;place-items:center;font-weight:800;color:var(--green)}
.title{font-weight:850;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{position:sticky;top:61px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:700;color:#4b5563}

main{max-width:1100px;margin:auto;padding:16px 14px 60px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;background:#edf2ef;color:var(--dark)}
.btn-p{background:var(--green2);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{margin:12px 0}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select{width:100%;border:1px solid var(--line);background:#fff;padding:12px;border-radius:12px;outline:none}
input:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.section{margin-top:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.h1{font-size:23px;font-weight:850;margin:4px 0 2px}
.h2{font-weight:800;font-size:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat .v{font-size:24px;font-weight:850;margin:4px 0;word-break:break-word}
.stat .l{font-size:12px;color:var(--muted)}
.srow{padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{position:relative;overflow:hidden;width:48px;height:48px;border-radius:12px;background:#e9f6ef;flex:none;display:grid;place-items:center;font-weight:800;color:var(--green)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nums{display:flex;gap:18px}
.nums div{text-align:center;min-width:64px}
.nums small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.nums b{font-size:18px}
.low{color:var(--danger)}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#e9f6ef;color:var(--green);margin-left:6px}
.badge.b-low{background:#fff4d6;color:var(--warn)}
.badge.b-out{background:#fdecee;color:var(--danger)}
.bar{height:9px;border-radius:9px;background:#e9f6ef;overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.b-sold{background:var(--green2)}
.b-rem{background:#b9dfc9}
.chart-row{margin:12px 0}
.chart-row .line{font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px}
.col i{display:block;width:100%;max-width:38px;background:var(--green2);border-radius:8px 8px 0 0;min-height:3px}
.col span{margin-top:5px;color:var(--muted)}
.search{margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{padding:0;overflow:hidden}
.pcard img,.pcard .ph{width:100%;height:150px;object-fit:cover;background:#e9f6ef;display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--green)}
.pcard .body{padding:13px}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.preview{width:100px;height:100px;border-radius:14px;object-fit:cover;margin-top:8px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:50}
.mcard{background:#fff;border-radius:22px;padding:22px;width:min(430px,100%);max-height:92vh;overflow:auto}
.mcard .brand{justify-content:center;flex-direction:column;text-align:center;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17251e;color:#fff;padding:11px 16px;border-radius:12px;z-index:100;max-width:90%;font-size:13px}
.spin{padding:50px;text-align:center;color:var(--muted)}

@media(max-width:800px){
.grid3{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:520px){
.grid3{grid-template-columns:1fr}
.row2{grid-template-columns:1fr}
.nums{width:100%;justify-content:space-between}
.nums div{min-width:0;flex:1}
}

html.bgmode .tabs{

.g3{font-size:14px;margin-top:8px}

/* ---- icons, glass stat cards, stock table, bottom nav ---- */
.ic{flex:none;display:block}
.tabs a{display:inline-flex;align-items:center;gap:8px}
.top .btn{display:inline-flex;align-items:center;gap:8px}

.card{
border-radius:22px;
box-shadow:0 6px 24px rgba(16,37,27,.10)
}
.stats{grid-template-columns:1fr 1fr}
a.stat{display:flex;align-items:center;gap:12px;color:inherit}
.stx{display:flex;flex-direction:column;min-width:0;flex:1}
.stat .t{font-size:14px;font-weight:700;color:#4b5563}
.stat .v{
font-size:28px;
font-weight:850;
line-height:1.15;
margin:2px 0;
word-break:break-word;
color:#0f1f17
}
.stat .l{font-size:13px;color:var(--muted)}
.chev{color:#9ca3af;display:grid;place-items:center;flex:none}
.sic{
width:48px;
height:48px;
border-radius:50%;
display:grid;
place-items:center;
flex:none
}
.sic.sm{width:34px;height:34px;border-radius:10px}
.c-green{background:#dff3e7;color:#198754}
.c-blue{background:#dbe8ff;color:#3b6fe0}
.c-orange{background:#fff0d1;color:#f59e0b}
.c-purple{background:#ece4ff;color:#7c4dff}
.c-teal{background:#d9f3ec;color:#14a08a}
.c-pink{background:#ffe3ea;color:#e0245e}
.ttl{display:inline-flex;align-items:center;gap:10px}
.gl{width:34px;height:3px;border-radius:3px;background:#22c55e;margin:12px 0}
.g4{display:flex;align-items:center;gap:10px;opacity:1;margin-top:0}
.greet{padding:36px 4px 6px}
.g2{font-size:40px}

.st{
display:grid;
grid-template-columns:20px minmax(0,1fr) 64px 92px 12px;
align-items:center;
gap:6px;
padding:10px 8px;
font-size:13px
}
.st-h{
background:rgba(0,0,0,.05);
border-radius:10px;
font-size:11px;
font-weight:700;
color:var(--muted)
}
.st-r{border-bottom:1px solid var(--line)}
.st-r:last-child{border-bottom:0}
.st .who{gap:8px;min-width:0}
.st .who b{
font-size:13px;
overflow:hidden;
text-overflow:ellipsis;

}
.st .thumb{
width:32px;
height:32px;

}
.pill{
font-style:normal;
display:inline-flex;
align-items:center;
gap:6px;
padding:4px 9px;
border-radius:999px;
font-size:11px;

}
.pill::before{
content:"";
width:7px;
height:7px;

.pill.ok{background:#dcf5e6;color:#0f8a4b}
.pill.low{background:#fff4d6;color:#b7791f}

.bnav{
position:fixed;
left:12px;
right:12px;
bottom:12px;
z-index:30;
display:flex;
justify-content:space-around;
max-width:640px;
margin:0 auto;
background:rgba(255,255,255,.93);

}
.bnav a{
flex:1;
display:flex;

align-items:center;
gap:3px;

}
.bnav a.on{color:var(--green2);font-weight:700}
.bnav a.on::after{
content:"";
position:absolute;
bottom:-2px;
width:44px;
height:3px;

background:var(--green2)
}

<body>

<div id="app">
  <div class="spin">Loading…</div>
</div>

<div id="modal"></div>
<div id="toast" class="toast hidden"></div>

<!-- Tool Manager Button -->
<button id="toolManagerBtn" class="btn btn-p" type="button">
  🧰 Tool Manager
</button>

<script>
(function () {
"use strict";

/* ---------- config ---------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcUkbQC4GZNM-XQh2Sa1hnEu_GfYRets4PVrda1piBRT3AkEhR6oeWtotd7KxyUQPj/exec";

var BOOT = {
  page: (location.hash || "").slice(1),
  appName: "Stock Manager",
  currency: "RWF",
  cloud: "",
  preset: "",
  folder: ""
};

function applyCfg(r) {
  if (r && r.config) BOOT = Object.assign(BOOT, r.config);
}

const PUBLIC = ["home", "analytics"];
const ADMIN = ["products", "sale", "settings"];

const TITLES = {
  home: "Home",
  analytics: "Analytics",
  products: "Products",
  sale: "Sales",
  settings: "Settings"
};

const S = {
  page: TITLES[BOOT.page] ? BOOT.page : "home",
  want: null,
  d: null,
  q: "",
  token: store("get"),
  busy: false
};

/*
 * Make the real admin login state available to the Tool Manager.
 * The Tool Manager does NOT use a separate "loggedIn" localStorage flag.
 */
window.getStockAdmin = function () {
  return !!(S.d && S.d.admin === true);
};

const UNITS = [
  "item",
  "kg",
  "g",
  "L",
  "ml",
  "box",
  "bag",
  "dozen"
];

const qu = (n, p) => {
  const u = (p && p.unit) || "item";
  return num(n) + " " + (u === "item" && Number(n) !== 1 ? "items" : u);
};

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',

  analytics:
    '<rect x="4" y="12" width="4" height="8" rx="1"/>' +
    '<rect x="10" y="7" width="4" height="13" rx="1"/>' +
    '<rect x="16" y="3" width="4" height="17" rx="1"/>',

  products:
    '<path d="M12 2l9 5v10l-9 5-9-5V7z"/>' +
    '<path d="M3 7l9 5 9-5M12 12v10"/>',

  sale:
    '<circle cx="9" cy="20" r="1.5"/>' +
    '<circle cx="18" cy="20" r="1.5"/>' +
    '<path d="M2 3h3l2.7 12.4a1 1 0 001 .8h8.9a1 1 0 001-.8L21 7H6"/>',

  settings:
    '<circle cx="12" cy="12" r="3"/>' +
    '<path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',

  check:
    '<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/>' +
    '<path d="M7.5 12.5l3 3 6-7" stroke="#fff"/>',

  coins:
    '<ellipse cx="12" cy="6" rx="7" ry="3"/>' +
    '<path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',

  trend:
    '<path d="M3 17l6-6 4 4 8-8"/>' +
    '<path d="M15 7h6v6"/>',

  cal:
    '<rect x="3" y="5" width="18" height="16" rx="2"/>' +
    '<path d="M8 3v4M16 3v4M3 10h18"/>' +
    '<path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',

  chev:
    '<path d="M9 6l6 6-6 6"/>',

  logout:
    '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>'
};

const ic = (n, s) =>
  `<svg class="ic" viewBox="0 0 24 24" width="${s || 22}" height="${s || 22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;

function store(op, v) {
  try {
    if (op === "get")
      return localStorage.getItem("stock_token") || "";

    if (op === "set")
      localStorage.setItem("stock_token", v);

    if (op === "del")
      localStorage.removeItem("stock_token");
  } catch (e) {}

  return "";
}

function getCache() {
  try {
    const r = localStorage.getItem("stock_cache_v3");
    return r ? JSON.parse(r) : null;
  } catch (e) {
    return null;
  }
}

function setCache(d) {
  try {
    if (d && !d.admin)
      localStorage.setItem("stock_cache_v3", JSON.stringify(d));
  } catch (e) {}
}

const $ = s => document.querySelector(s);

const esc = v =>
  String(v == null ? "" : v).replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m])
  );

const num = v =>
  Number(v || 0).toLocaleString(undefined, {
    maximumFractionDigits: 3
  });

const money = v =>
  Number(v || 0).toLocaleString(undefined, {
    maximumFractionDigits: 2
  }) + " " + BOOT.currency;

const when = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d)
    ? ""
    : d.toLocaleString([], {
        dateStyle: "medium",
        timeStyle: "short"
      });
};

const link = p => "#" + p;

const small = u =>
  u
    ? String(u).replace(
        "/upload/",
        "/upload/w_200,h_200,c_fill,q_auto,f_auto/"
      )
    : "";

const val = id => {
  const el = document.getElementById(id);
  return el ? el.value : "";
};

let toastTimer;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    () => t.classList.add("hidden"),
    3000
  );
}

/* ---------- backend call: Code.gs api(action, payload) ---------- */

function api(action, p) {
  return fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(
      Object.assign(
        {
          action: action,
          token: S.token
        },
        p || {}
      )
    )
  })
    .then(res => res.json())
    .then(
      r => {
        if (r && r.ok) return r;

        if (r && r.auth)
          dropSession();

        throw new Error(
          (r && r.msg) || "Request failed"
        );
      },
      () => {
        throw new Error(
          "Cannot reach the server. Check your internet and that the Web app is deployed with access: Anyone."
        );
      }
    );
}

function dropSession() {
  S.token = "";
  store("del");

  if (S.d)
    S.d.admin = false;

  updateToolManager();
}

function upload(file) {
  return new Promise((resolve, reject) => {
    if (!file)
      return reject(new Error("Choose a file"));

    if (!BOOT.cloud || !BOOT.preset)
      return reject(
        new Error("Cloudinary is not configured")
      );

    const fd = new FormData();

    fd.append("file", file);
    fd.append("upload_preset", BOOT.preset);

    if (BOOT.folder)
      fd.append("folder", BOOT.folder);

    const x = new XMLHttpRequest();

    x.open(
      "POST",
      "https://api.cloudinary.com/v1_1/" +
        encodeURIComponent(BOOT.cloud) +
        "/image/upload"
    );

    x.timeout = 120000;

    x.onload = () => {
      try {
        const j = JSON.parse(x.responseText);

        if (
          x.status >= 200 &&
          x.status < 300 &&
          j.secure_url
        ) {
          resolve(j.secure_url);
        } else {
          reject(
            new Error(
              (j.error && j.error.message) ||
                "Image upload failed"
            )
          );
        }
      } catch (e) {
        reject(
          new Error("Invalid upload response")
        );
      }
    };

    x.onerror = () =>
      reject(new Error("Upload network error"));

    x.ontimeout = () =>
      reject(new Error("Upload timed out"));

    x.send(fd);
  });
}

function thumb(p) {

function stat(l, v, sub, icon, cls, page) {
  return `
  <a class="card stat" href="${esc(
    link(page)
  )}" data-page="${page}">
    <span class="sic ${cls}">

function status(p, low) {

    ? `<span class="badge b-out">Out</span>`
    : p.remaining <= low
    ? `<span class="badge b-low">Low</span>`
    : "";

function stackedBars(items, emptyMsg) {
  if (!items.length)
    return `<div class="muted">${
      emptyMsg || "No products yet."
    }</div>`;

  const max = Math.max(
    1,
    ...items.map(p => p.purchased)
  );

  return (
    `<div class="legend">
      <span><i class="b-sold"></i>Sold</span>
      <span><i class="b-rem"></i>Remaining</span>
    </div>` +

    items
      .map(
        p =>
          `<div class="chart-row">
            <div class="line">
              <span>${esc(p.name)}</span>
              <b>${qu(p.sold, p)} sold · ${qu(
                p.remaining,
                p
              )} left</b>
            </div>

            <div class="bar" style="margin-top:5px">
              <i class="b-sold" style="width:${
                (p.sold / max) * 100
              }%"></i>

              <i class="b-rem" style="width:${
                (Math.max(0, p.remaining) / max) * 100
              }%"></i>
            </div>
          </div>`
      )
      .join("")
  );
}

function emptyBox() {
  return `
  <div class="card muted">
    No products yet.

        ? `<a href="${esc(
            link("products")

    String(p.name)
      .toLowerCase()

async function addProduct(btn) {
  const err = $("#perr");

  err.textContent = "";

  const name =
    val("pn").trim();

  const qty =
    Number(val("pq"));

  const cost =
    Number(val("pc"));

  if (!name) {
    err.textContent =
      "Product name is required";
    return;
  }

  if (!isFinite(qty) || qty <= 0) {
    err.textContent =
      "Quantity must be greater than zero";
    return;
  }

  if (
    val("pc") === "" ||
    !isFinite(cost) ||
    cost < 0
  ) {
    err.textContent =
      "Enter a cost (0 or more)";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const file =
      $("#pf").files[0];

    const imageUrl =
      file
        ? await upload(file)
        : "";

    await api(
      "addProduct",
      {
        name: name,
        quantity: qty,
        unit:
          val("pu") || "item",
        costPerUnit: cost,
        imageUrl: imageUrl
      }
    );

    await refresh();

    toast("Product added");
  } catch (e) {
    err.textContent =
      e.message;

    btn.disabled = false;
    btn.textContent =
      "Add product";
  }
}

                    <td>
                      ${esc(
                        when(
                          s.date
                        )
                      )}
                    </td>

                    <td>
                      ${esc(
                        s.name
                      )}
                    </td>

                    <td>
                      ${num(
                        s.qty
                      )}
                    </td>

                    <td>
                      ${money(
                        s.total
                      )}
                    </td>

                  </tr>`
                )
                .join("")}

            </tbody>

          </table>

        </div>`
        : `<div class="muted">
             No sales yet.
           </div>`
    }

  </div>`;

  const sp = $("#sp");

  const setLabel = () => {
    const p =
      list.find(
        x =>
          String(x.id) ===
          sp.value
      );

    $("#sql").textContent =
      "Quantity" +
      (p && p.unit
        ? " (" + p.unit + ")"
        : "");
  };

  sp.addEventListener(
    "change",
    setLabel
  );

  setLabel();
}

async function recordSale(btn) {
  const err = $("#serr");

  err.textContent = "";

  const id = val("sp");

  const qty =
    Number(val("sq"));

  const p =
    ((S.d &&
      S.d.products) ||
      []).find(
        x =>
          String(x.id) ===
          id
      );

  const whole =
    !p ||
    !p.unit ||
    p.unit === "item" ||
    p.unit === "box" ||
    p.unit === "bag" ||
    p.unit === "dozen";

  if (!id) {
    err.textContent =
      "Choose a product";
    return;
  }

  if (
    !isFinite(qty) ||
    qty <= 0
  ) {
    err.textContent =
      "Enter a quantity greater than zero";
    return;
  }

  if (
    whole &&
    Math.floor(qty) !== qty
  ) {
    err.textContent =
      "Enter a whole quantity";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const r =
      await api(
        "recordSale",
        {
          productId: id,
          quantity: qty
        }
      );

    await refresh();

    toast(
      "Sale recorded · " +
        num(r.remaining) +
        " left"
    );
  } catch (e) {
    err.textContent =
      e.message;

    btn.disabled = false;
    btn.textContent =
      "Record sale";
  }
}

function parseSale(text, list) {
  const t =
    text
      .toLowerCase()
      .replace(/,/g, ".");

  const m =
    t.match(
      /(\d+(?:\.\d+)?)/
    );

  if (!m) {
    return {
      err:
        "I can't see a quantity. Example: ngurishije Coffee Beans 2"
    };
  }

  const words =
    t
      .replace(
        m[0],
        " "
      )
      .replace(
        /\b(ngurishije|nagurishije|sold|sell|kg|g|l|ml|litres?|liters?|items?|ibintu|ikilo|amakilo|box|bag|dozen)\b/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  let best = null;
  let score = 0;

  list.forEach(p => {
    const n =
      String(p.name)
        .toLowerCase();

    let sc = 0;

    if (
      words &&
      n === words
    ) {
      sc = 3;
    } else if (
      words &&
      (
        n.includes(words) ||
        words.includes(n)
      )
    ) {
      sc = 2;
    } else {
      const w =
        words
          .split(" ")
          .filter(
            x => x.length > 2
          );

      sc =
        w.filter(
          x => n.includes(x)
        ).length /
        Math.max(
          1,
          w.length
        );
    }

    if (sc > score) {
      score = sc;
      best = p;
    }
  });

  if (
    !best ||
    score < 0.5
  ) {
    return {
      err:
        "Product not found. Check the name."
    };
  }

  return {
    p: best,
    qty: Number(m[1])
  };
}

async function quickSale(btn) {
  const err = $("#qerr");

  err.textContent = "";

  const r =
    parseSale(
      val("qs"),
      (S.d &&
        S.d.products) ||
        []
    );

  if (r.err) {
    err.textContent =
      r.err;
    return;
  }

  const p = r.p;

  if (
    r.qty >
    p.remaining
  ) {
    err.textContent =
      "Only " +
      qu(
        p.remaining,
        p
      ) +
      " left";

    return;
  }

  if (
    !confirm(
      "Sell " +
        qu(r.qty, p) +
        " of " +
        p.name +
        "?\n" +
        qu(
          p.remaining -
            r.qty,
          p
        ) +
        " will remain."
    )
  )
    return;

  btn.disabled = true;

  try {
    const x =
      await api(
        "recordSale",
        {
          productId: p.id,
          quantity: r.qty
        }
      );

    await refresh();

    toast(
      "Sale recorded · " +
        num(x.remaining) +
        " left"
    );
  } catch (e) {
    err.textContent =
      e.message;

    btn.disabled = false;
  }
}

async function saveBrand(btn) {
  const type =
    btn.dataset.type;

  const err =
    $("#berr");

  err.textContent = "";

  const file =
    $(
      type === "logo"
        ? "#lf"
        : "#bf"
    ).files[0];

  if (!file) {
    err.textContent =
      "Choose an image first";
    return;
  }

  const old =
    btn.textContent;

  btn.disabled = true;
  btn.textContent =
    "Uploading…";

  try {
    const url =
      await upload(file);

    await api(
      "saveBrand",
      {
        type: type,
        url: url
      }
    );

    await refresh();

    toast("Saved");
  } catch (e) {
    err.textContent =
      e.message;

    btn.disabled = false;
    btn.textContent =
      old;
  }
}

async function changePw(btn) {
  const err =
    $("#cerr");

  err.textContent = "";

  if (
    val("np").length <
    8
  ) {
    err.textContent =
      "New password must be at least 8 characters";
    return;
  }

  btn.disabled = true;

  try {
    await api(
      "changePassword",
      {
        currentPassword:
          val("cp"),

        newPassword:
          val("np")
      }
    );

    $("#cp").value = "";
    $("#np").value = "";

    toast(
      "Password changed"
    );
  } catch (e) {
    err.textContent =
      e.message;
  }

  btn.disabled = false;
}

/* ---------- login / logout ---------- */

function openLogin() {
  $("#modal").innerHTML = `
  <div
    class="modal"
    data-act="login-close"
  >

    <div
      class="mcard"
      data-stop="1"
    >

      <div class="brand">

        <div class="logo">
          ${esc(
            BOOT.appName.charAt(0)
          )}
        </div>

        <div class="title">
          Admin login
        </div>

      </div>

      <div class="field">

        <label for="lu">
          Username
        </label>

        <input
          id="lu"
          autocomplete="username"
          autocapitalize="none"
        >

      </div>

      <div class="field">

        <label for="lp">
          Password
        </label>

        <input
          id="lp"
          type="password"
          autocomplete="current-password"
        >

      </div>

      <button
        class="btn btn-p"
        style="width:100%"
        data-act="login"
      >
        Login
      </button>

      <div
        class="error"
        id="lerr"
      ></div>

      <button
        class="btn"
        style="width:100%;margin-top:6px"
        data-act="login-close"
      >
        Cancel
      </button>

    </div>

  </div>`;

  setTimeout(() => {
    const u = $("#lu");

    if (u)
      u.focus();
  }, 50);

  ["lu", "lp"].forEach(
    id => {
      $("#" + id).addEventListener(
        "keydown",
        e => {
          if (
            e.key === "Enter"
          ) {
            doLogin(
              $(
                "[data-act=login]"
              )
            );
          }
        }
      );
    }
  );
}

function closeLogin() {
  $("#modal").innerHTML = "";
  S.want = null;
}

async function doLogin(btn) {
  const err =
    $("#lerr");

  err.textContent = "";

  const username =
    val("lu").trim();

  const password =
    val("lp");

  if (
    !username ||
    !password
  ) {
    err.textContent =
      "Enter username and password";
    return;
  }

  btn.disabled = true;
  btn.textContent =
    "Signing in…";

  try {
    const r =
      await api(
        "login",
        {
          username:
            username,

          password:
            password,

          token: ""
        }
      );

    S.token =
      r.token;

    store(
      "set",
      r.token
    );

    const target =
      S.want || "home";

    $("#modal").innerHTML =
      "";

    S.want = null;

    await load();

    updateToolManager();

    go(target);
  } catch (e) {
    err.textContent =
      e.message;

    btn.disabled = false;
    btn.textContent =
      "Login";
  }
}

async function doLogout() {
  try {
    await api("logout");
  } catch (e) {}

  dropSession();

  /*
   * Immediately hide Tool Manager
   * after logout.
   */
  updateToolManager();

  try {
    await load();
  } catch (e) {}

  go("home");

  updateToolManager();
}

/* ---------- Tool Manager visibility ---------- */

function updateToolManager() {
  const btn =
    document.getElementById(
      "toolManagerBtn"
    );

  if (!btn)
    return;

  /*
   * IMPORTANT:
   * Only the real admin state controls
   * the Tool Manager.
   */
  const loggedIn =
    !!(
      S &&
      S.d &&
      S.d.admin === true
    );

  btn.style.display =
    loggedIn
      ? "block"
      : "none";
}

/* ---------- events ---------- */

document.addEventListener(
  "click",
  e => {

    const a =
      e.target.closest(
        "a[data-page]"
      );

    if (a) {
      e.preventDefault();

      go(
        a.dataset.page
      );

      return;
    }

    const el =
      e.target.closest(
        "[data-act]"
      );

    if (!el)
      return;

    const act =
      el.dataset.act;

    if (
      act === "login-close" &&
      el.classList.contains(
        "modal"
      ) &&
      e.target !== el
    )
      return;

    if (
      act ===
      "login-open"
    )
      openLogin();

    else if (
      act ===
      "login-close"
    )
      closeLogin();

    else if (
      act ===
      "login"
    )
      doLogin(el);

    else if (
      act ===
      "logout"
    )
      doLogout();

    else if (
      act ===
      "add-product"
    )
      addProduct(el);

    else if (
      act ===
      "record-sale"
    )
      recordSale(el);

    else if (
      act ===
      "quick-sale"
    )
      quickSale(el);

    else if (
      act ===
      "save-brand"
    )
      saveBrand(el);

    else if (
      act ===
      "change-pw"
    )
      changePw(el);
  }
);

/* ---------- Tool Manager click ---------- */

document
  .getElementById(
    "toolManagerBtn"
  )
  .addEventListener(
    "click",
    function () {

      /*
       * Extra security on the client:
       * don't navigate if admin is not logged in.
       */
      if (
        !(
          S &&
          S.d &&
          S.d.admin === true
        )
      ) {
        updateToolManager();
        return;
      }

      window.location.href =
        "tools.html";
    }
  );

/* ---------- start ---------- */

(async function start() {

  const cached =
    S.token
      ? null
      : getCache();

  if (cached) {
    applyCfg(cached);

    S.d = cached;

    go(S.page);

    updateToolManager();
  }

  try {
    await load();

    go(S.page);

    updateToolManager();

  } catch (e) {

    if (!S.d) {

      $("#app").innerHTML = `
      <div class="spin">

        Could not load data.

        <div class="error">
          ${esc(e.message)}
        </div>

        <button
          class="btn btn-p"
          id="retry"
        >
          Retry
        </button>

      </div>`;

      $("#retry").addEventListener(
        "click",
        () =>
          location.reload()
      );

    } else {

      toast(
        e.message
      );
    }
  }

})();
})();
</script>
