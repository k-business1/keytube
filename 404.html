<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e50914">
  <meta name="robots" content="noindex, follow">  <title>404 - Page Not Found | KEYTUBE</title>  <style>
    :root {
      --red: #e50914;
      --dark-red: #b80710;
      --text: #171717;
      --muted: #737373;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #ffe5e6 0%, transparent 55%),
        #fff;
    }

    .page {
      width: 100%;
      max-width: 420px;
      padding: clamp(20px, 4vh, 32px) clamp(16px, 5vw, 28px);
      text-align: center;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #f1eeee;
      border-radius: 24px;
      box-shadow: 0 15px 55px rgba(30, 0, 0, 0.09);
      animation: enter 0.55s ease-out;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* KEYTUBE BRAND */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 17px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    .brand-name span {
      color: var(--red);
    }

    .brand-line {
      width: 38px;
      height: 3px;
      margin: 0 auto 23px;
      background: var(--red);
      border-radius: 10px;
    }

    /* 404 WITH THE EYE REPLACING ZERO */
    .error-code {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1px;
      color: var(--red);
      font-size: clamp(90px, 25vw, 122px);
      font-weight: 950;
      letter-spacing: -5px;
      line-height: 1;
      text-shadow: 0 4px 0 #ffe1e2;
    }

    .digit {
      display: inline-block;
    }

    /* ZERO SHAPE */
    .zero-eye {
      width: 0.76em;
      height: 0.83em;
      flex-shrink: 0;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
      border: 5px solid var(--red);
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 4px 0 #ffe1e2;
      text-shadow: none;
    }

    /* EYE INSIDE THE ZERO */
    .eye {
      width: 76%;
      height: 53%;
      position: relative;
      display: block;
      overflow: hidden;
      border: 3px solid #202020;
      border-radius: 50% 50% 48% 48%;
      background: #fff;
      transform: rotate(-5deg);
      transform-origin: center;
      animation: blink 4s infinite;
    }

    /* MOVING RED PUPIL */
    .pupil {
      width: 37%;
      height: 76%;
      position: absolute;
      left: 31%;
      top: 9%;
      border: 2px solid #202020;
      border-radius: 50%;
      background: var(--red);
      animation: look 5s infinite;
    }

    .pupil::after {
      content: "";
      position: absolute;
      width: 32%;
      height: 24%;
      left: 14%;
      top: 9%;
      border-radius: 50%;
      background: white;
    }

    @keyframes blink {
      0%, 43%, 47%, 78%, 82%, 100% {
        transform: rotate(-5deg) scaleY(1);
      }

      45%, 80% {
        transform: rotate(-5deg) scaleY(0.05);
      }
    }

    @keyframes look {
      0%, 43%, 47%, 78%, 82%, 100% {
        left: 31%;
      }

      20% {
        left: 48%;
      }

      60% {
        left: 15%;
      }
    }

    /* ERROR MESSAGE */
    h1 {
      margin-top: 19px;
      font-size: clamp(21px, 5.5vw, 27px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .description {
      max-width: 310px;
      margin: 11px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .requested-path {
      width: 100%;
      margin-top: 19px;
      padding: 11px 12px;
      overflow-wrap: anywhere;
      border: 1px solid #f5dada;
      border-radius: 10px;
      background: #fff6f6;
      color: #bd1018;
      font-size: 12px;
      line-height: 1.5;
    }

    /* COUNTDOWN */
    .redirect-box {
      margin-top: 18px;
      padding: 13px 10px;
      background: #fafafa;
      border: 1px solid #eeeeee;
      border-radius: 12px;
    }

    .redirect-label {
      margin-bottom: 8px;
      color: #666;
      font-size: 12px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      color: #555;
      font-size: 13px;
    }

    .timer {
      min-width: 36px;
      padding: 5px 8px;
      border-radius: 7px;
      background: var(--red);
      color: white;
      font-size: 19px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* HOMEPAGE BUTTON */
    .home-button {
      width: 100%;
      min-height: 49px;
      margin-top: 15px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: none;
      border-radius: 11px;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 750;
      box-shadow: 0 5px 14px rgba(229, 9, 20, 0.19);
      transition: background 0.2s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .home-button:hover {
      background: var(--dark-red);
    }

    .home-button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 21px;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer strong {
      color: var(--red);
    }

    /* SHORT MOBILE SCREENS */
    @media (max-height: 650px) {
      .page {
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .brand {
        margin-bottom: 10px;
      }

      .brand-line {
        margin-bottom: 15px;
      }

      .error-code {
        font-size: clamp(76px, 20vw, 96px);
      }

      h1 {
        margin-top: 12px;
      }

      .description {
        margin-top: 7px;
        font-size: 13px;
      }

      .requested-path {
        margin-top: 12px;
        padding: 8px;
      }

      .redirect-box {
        margin-top: 12px;
        padding: 9px;
      }

      .home-button {
        min-height: 44px;
        margin-top: 10px;
        padding: 11px;
      }

      .footer {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style></head><body>  <main class="page"><!-- BRAND -->
<header class="brand">
  <img src="../imagelib/logo.png" alt="KEYTUBE Logo">
  <div class="brand-name">KEY<span>TUBE</span></div>
</header>

<div class="brand-line"></div>

<!-- THE EYE REPLACES ZERO: 4 [EYE] 4 -->
<div class="error-code" aria-label="404">

  <span class="digit" aria-hidden="true">4</span>

  <span class="zero-eye" aria-hidden="true">
    <span class="eye">
      <span class="pupil"></span>
    </span>
  </span>

  <span class="digit" aria-hidden="true">4</span>

</div>

<!-- MESSAGE -->
<h1>Page Not Found</h1>

<p class="description">
  Oops! This page seems to have disappeared.
  Let's get you back to KEYTUBE and keep exploring.
</p>

<!-- REQUESTED PAGE -->
<div class="requested-path" id="requestedPath"></div>

<!-- AUTOMATIC REDIRECT -->
<section class="redirect-box" aria-live="polite">
  <p class="redirect-label">Taking you back to KEYTUBE</p>

  <div class="timer-row">
    <span>Redirecting in</span>
    <span class="timer" id="seconds">10</span>
    <span>seconds</span>
  </div>
</section>

<!-- MANUAL REDIRECT -->
<a
  href="https://www.keytube.work.gd"
  class="home-button"
  id="homeButton">

  <span aria-hidden="true">&#8592;</span>
  <span>Back to KEYTUBE</span>

</a>

<!-- FOOTER -->
<footer class="footer">
  &copy; <span id="year"></span>
  <strong>KEYTUBE</strong>. All rights reserved.
</footer>

  </main>  <script>
    (() => {
      const homeURL = "https://www.keytube.work.gd";

      // Display the requested path safely.
      document.getElementById("requestedPath").textContent =
        "Requested page: " + window.location.pathname;

      // Current year.
      document.getElementById("year").textContent =
        new Date().getFullYear();

      // Homepage button.
      document.getElementById("homeButton").href = homeURL;

      // Redirect after 10 seconds.
      let remainingSeconds = 10;
      const secondsDisplay = document.getElementById("seconds");

      const countdown = setInterval(() => {
        remainingSeconds--;
        secondsDisplay.textContent = remainingSeconds;

        if (remainingSeconds <= 0) {
          clearInterval(countdown);
          window.location.replace(homeURL);
        }
      }, 1000);
    })();
  </script></body>
</html>
