<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KEYTUBE</title>

  <!-- Root styles only: page-specific styles live in /style/ and pages include them from there -->
  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/pages.css">
  <link rel="stylesheet" href="/style/responsive.css">
</head>
<body>
  <!-- INDEX (root) — only HTML file at repository root. All pages are under /pages/ -->
  <header id="site-header">
    <div class="container">
      <a class="logo" href="/index.html"><img src="/imagelib/logo.png" alt="Keytube logo"></a>
      <nav id="main-nav">
        <ul>
          <li><a href="/pages/watch.html">Watch</a></li>
          <li><a href="/pages/search.html">Search</a></li>
          <li><a href="/pages/profile.html">Profile</a></li>
          <li><a href="/pages/channel.html">Channel</a></li>
          <li><a href="/pages/playlist.html">Playlist</a></li>
          <li><a href="/pages/about.html">About</a></li>
          <li><a href="/pages/contact.html">Contact</a></li>
          <li><a href="/pages/help.html">Help</a></li>
          <li><a href="/pages/studio.html">Studio</a></li>
          <li><a href="/pages/login.html">Login</a></li>
          <li><a href="/pages/register.html">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="hero container">
      <h1>Welcome to Keytube</h1>
      <p>All pages are stored under <code>/pages/</code>. All JavaScript lives in <code>/app/</code> and styles in <code>/style/</code>.</p>
      <p>Use the links above to open the site pages.</p>
    </section>
  </main>

  <footer id="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Keytube</p>
    </div>
  </footer>

  <!-- Application scripts (all JS kept in /app/) -->
  <script src="/app/api.js" defer></script>
  <script src="/app/main.js" defer></script>
  <script src="/app/auth.js" defer></script>
  <script src="/app/movies.js" defer></script>
  <script src="/app/users.js" defer></script>
  <script src="/app/comments.js" defer></script>
  <script src="/app/playlist.js" defer></script>
  <script src="/app/notifications.js" defer></script>
  <script src="/app/search.js" defer></script>
  <script src="/app/studio.js" defer></script>

  <!-- Admin and user area scripts (kept in their folders) -->
  <script src="/admin/admin.js" defer></script>
  <script src="/user/profile.js" defer></script>
  <script src="/user/studio/studio.js" defer></script>
  <script src="/user/channels/channel.js" defer></script>

  <!-- Small inline helper only to set the current year; no feature logic here -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
