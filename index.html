<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KEYTUBE — Home</title><link rel="stylesheet" href="style/main.css"><link rel="stylesheet" href="style/responsive.css"><link rel="icon" href="imagelib/logo.png" type="image/png"></head><body><div id="toast" class="toast"></div><header class="app-header"><div class="header-left"><a href="index.html" class="brand-logo"><img src="imagelib/logo.png" alt="KEYTUBE Logo" onerror="this.src='https://via.placeholder.com/40'"><span class="brand-name">KEYTUBE</span></a></div><div class="header-center"><form id="globalSearchForm" class="search-form"><input type="text" id="globalSearchInput" placeholder="Search videos, creators, categories..." required><button type="submit" class="search-btn">🔍</button></form></div><div class="header-right" id="navUserMenu"><a href="pages/login.html" class="nav-btn">Sign In</a><a href="pages/register.html" class="nav-btn btn-primary">Register</a></div></header><div class="app-layout"><aside class="sidebar"><nav class="sidebar-nav"><a href="index.html" class="nav-item active">🏠 Home</a><a href="pages/playlist.html" class="nav-item">📁 Saved Playlist</a><a href="pages/studio.html" class="nav-item">🎬 Creator Studio</a><hr class="sidebar-divider"><a href="pages/about.html" class="nav-item">ℹ️ About</a><a href="pages/contact.html" class="nav-item">✉️ Contact</a><a href="pages/help.html" class="nav-item">❓ Help</a></nav></aside><main class="main-content"><section class="category-bar" id="categoryBar"><button class="cat-btn active" data-category="all">All</button><button class="cat-btn" data-category="movie">Movies</button><button class="cat-btn" data-category="series">Series</button><button class="cat-btn" data-category="music">Music</button><button class="cat-btn" data-category="gaming">Gaming</button><button class="cat-btn" data-category="education">Education</button></section><section class="video-grid-container"><h2>Recommended Videos</h2><div class="video-grid" id="videoGrid"><p class="loading-text">Loading videos...</p></div></section></main></div><script src="app/api.js"></script><script src="app/auth.js"></script><script src="app/movies.js"></script><script src="app/playlist.js"></script><script src="app/search.js"></script><script src="app/notifications.js"></script><script src="app/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{loadHomeVideos();setupCategoryFilters();});async function loadHomeVideos(category="all"){const grid=document.getElementById("videoGrid");grid.innerHTML="<p class='loading-text'>Loading videos...</p>";const filters=category!=="all"?{category}:{};const res=await fetchMovies(filters);if(res.ok&&res.movies&&res.movies.length>0){grid.innerHTML=res.movies.map(movie=>renderVideoCard(movie)).join("");}else{grid.innerHTML="<p class='empty-state'>No videos found in this category.</p>";}}function renderVideoCard(movie){return `<div class="video-card" onclick="window.location.href='pages/watch.html?id=${movie.id}'"><div class="thumbnail-wrapper"><img src="${movie.coverUrl||'https://via.placeholder.com/320x180'}" alt="${movie.name}" class="thumbnail" onerror="this.src='https://via.placeholder.com/320x180'"></div><div class="card-details"><h3 class="video-title">${movie.name}</h3><p class="video-meta">${movie.category||'General'} • ${movie.views||0} views</p></div></div>`;}function setupCategoryFilters(){const buttons=document.querySelectorAll(".cat-btn");buttons.forEach(btn=>{btn.addEventListener("click",()=>{buttons.forEach(b=>b.classList.remove("active"));btn.classList.add("active");loadHomeVideos(btn.dataset.category);});});}</script></body></html>
